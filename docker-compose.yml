# gRPC addresses of the Registry Nodes used by clients (mocks and load balancer)
x-registry-addresses: &registry-addresses >-
  registry-1:7000,
  registry-2:7000,
  registry-3:7000,
  registry-4:7000,
  registry-5:7000

x-registry-dependencies: &registry-dependencies
  - registry-1
  - registry-2
  - registry-3
  - registry-4
  - registry-5

x-registry-environment: &registry-environment
  # Consistency backend: cp (Raft) or ap (Gossip + SWIM). Selected with BACKEND=ap make docker-up
  BACKEND: ${BACKEND:-cp}
  # Static membership: comma-separated id=grpc_address|peer_address entries
  CLUSTER_MEMBERS: >-
    registry-1=registry-1:7000|registry-1:7001,
    registry-2=registry-2:7000|registry-2:7001,
    registry-3=registry-3:7000|registry-3:7001,
    registry-4=registry-4:7000|registry-4:7001,
    registry-5=registry-5:7000|registry-5:7001
  # gRPC listen address: Registry API, Forwarding (CP) and Anti-Entropy (AP)
  GRPC_BIND_ADDRESS: 0.0.0.0:7000
  # Observability listen address: /metrics, /healthz and /readyz
  OBSERVABILITY_BIND_ADDRESS: 0.0.0.0:10000
  # Instance TTL = heartbeat_interval × multiplier
  HEARTBEAT_TTL_MULTIPLIER: 3
  # Node-to-node listen address: Raft over TCP (CP) or SWIM and Gossip over UDP (AP)
  PEER_BIND_ADDRESS: 0.0.0.0:7001
  # Directory where Raft stores its log, stable state and snapshots (CP)
  RAFT_DATA_DIR: /data/raft
  # Timeout of each attempt to forward an operation to the leader (CP)
  FORWARD_TIMEOUT: 2s
  # Maximum forwarding attempts before returning an error (CP)
  FORWARD_MAX_ATTEMPTS: 3
  # Maximum number of ALIVE nodes each new state version is gossiped to (AP)
  GOSSIP_FANOUT: 3
  # Time between anti-entropy rounds, also the timeout of each round (AP)
  ANTI_ENTROPY_INTERVAL: 5s

x-registry: &registry
  image: daanilo/registry:dev
  build:
    context: .
    args:
      SERVICE: registry

x-mock-service-environment: &mock-service-environment
  # Service name the instance registers under
  NAME: mock-service
  # Registry Nodes that receive Register and heartbeats. If one fails the next one is tried
  REGISTRY_ADDRESSES: *registry-addresses
  # HTTP listen address for requests coming from the load balancer
  HTTP_BIND_ADDRESS: 0.0.0.0:9000
  # Observability listen address: /metrics, /healthz and /readyz
  OBSERVABILITY_BIND_ADDRESS: 0.0.0.0:10020
  # Instance weight for the load balancer weighted strategy
  WEIGHT: 1
  # Interval between heartbeats. The registry derives the instance TTL from it
  HEARTBEAT_INTERVAL: 5s

x-mock-service: &mock-service
  image: daanilo/mock-service:dev
  build:
    context: .
    args:
      SERVICE: mock-service
  depends_on: *registry-dependencies

services:
  registry-1:
    <<: *registry
    environment:
      <<: *registry-environment
      # Node id, must match its id in CLUSTER_MEMBERS
      INSTANCE_ID: registry-1
    volumes:
      - registry-1-data:/data

  registry-2:
    <<: *registry
    environment:
      <<: *registry-environment
      INSTANCE_ID: registry-2
    volumes:
      - registry-2-data:/data

  registry-3:
    <<: *registry
    environment:
      <<: *registry-environment
      INSTANCE_ID: registry-3
    volumes:
      - registry-3-data:/data

  registry-4:
    <<: *registry
    environment:
      <<: *registry-environment
      INSTANCE_ID: registry-4
    volumes:
      - registry-4-data:/data

  registry-5:
    <<: *registry
    environment:
      <<: *registry-environment
      INSTANCE_ID: registry-5
    volumes:
      - registry-5-data:/data

  load-balancer:
    image: daanilo/load-balancer:dev
    build:
      context: .
      args:
        SERVICE: load-balancer
    environment:
      # Registry Nodes used for Watch. gRPC spreads the connections across them (round-robin)
      REGISTRY_ADDRESSES: *registry-addresses
      # Services to balance: comma-separated service:strategy (round-robin, least-connections, weighted)
      SERVICES: mock-service:round-robin
      # HTTP listen address: /{service}/... is routed to an instance of that service
      HTTP_BIND_ADDRESS: 0.0.0.0:8000
      # Observability listen address: /metrics, /healthz and /readyz
      OBSERVABILITY_BIND_ADDRESS: 0.0.0.0:10010
      # Wait before reopening a broken Watch stream
      REGISTRY_RETRY_INTERVAL: 1s
      # Idle time after which a gRPC keepalive ping is sent to the registry (minimum 10s)
      REGISTRY_KEEPALIVE_TIME: 10s
      # Maximum wait for the keepalive response before the connection is considered dead
      REGISTRY_KEEPALIVE_TIMEOUT: 5s
    ports:
      - "8000:8000"
      - "10010:10010"
    depends_on: *registry-dependencies

  mock-service-1:
    <<: *mock-service
    environment:
      <<: *mock-service-environment
      # Instance id within the service
      INSTANCE_ID: mock-service-1
      # Address published in the registry, used by the load balancer to reach the instance
      ADVERTISE_ADDRESS: mock-service-1:9000

  mock-service-2:
    <<: *mock-service
    environment:
      <<: *mock-service-environment
      INSTANCE_ID: mock-service-2
      ADVERTISE_ADDRESS: mock-service-2:9000

  mock-service-3:
    <<: *mock-service
    environment:
      <<: *mock-service-environment
      INSTANCE_ID: mock-service-3
      ADVERTISE_ADDRESS: mock-service-3:9000

  dozzle:
    image: amir20/dozzle:latest
    profiles: ["debug"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "127.0.0.1:8081:8080"

  grafana:
    image: grafana/grafana:latest
    ports:
      - "8082:3000"
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "8083:9090"
    depends_on:
      - load-balancer
      - mock-service-1
      - mock-service-2
      - mock-service-3

volumes:
  registry-1-data:
  registry-2-data:
  registry-3-data:
  registry-4-data:
  registry-5-data:
