services:
  registry:
    image: daanilo/registry:dev
    build:
      context: .
      args:
        SERVICE: registry
    environment:
      INSTANCE_ID: registry-1
      BACKEND: ap
      CLUSTER_MEMBERS: registry:7000
      GRPC_ADDRESS: 0.0.0.0:7000
      OBSERVABILITY_ADDRESS: 0.0.0.0:10000
      HEARTBEAT_TTL_MULTIPLIER: 3
    ports:
      - "7000:7000"
      - "10000:10000"

  load-balancer:
    image: daanilo/load-balancer:dev
    build:
      context: .
      args:
        SERVICE: load-balancer
    environment:
      REGISTRY_ADDRESSES: registry:7000
      SERVICES: mock-service:round-robin
      HTTP_ADDRESS: 0.0.0.0:8000
      OBSERVABILITY_ADDRESS: 0.0.0.0:10010
      REGISTRY_RETRY_INTERVAL: 1s
      REGISTRY_KEEPALIVE_TIME: 10s
      REGISTRY_KEEPALIVE_TIMEOUT: 5s
    ports:
      - "8000:8000"
      - "10010:10010"
    depends_on:
      - registry

  mock-service:
    image: daanilo/mock-service:dev
    build:
      context: .
      args:
        SERVICE: mock-service
    environment:
      NAME: mock-service
      INSTANCE_ID: mock-service-1
      REGISTRY_ADDRESSES: registry:7000
      ADVERTISE_ADDRESS: mock-service:9000
      HTTP_ADDRESS: 0.0.0.0:9000
      OBSERVABILITY_ADDRESS: 0.0.0.0:10020
      WEIGHT: 1
      HEARTBEAT_INTERVAL: 5s
    ports:
      - "9000:9000"
      - "10020:10020"
    depends_on:
      - registry

  dozzle:
    image: amir20/dozzle:latest
    profiles: ["debug"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "127.0.0.1:8081:8080"

  grafana:
    image: grafana/grafana:latest
    ports:
      - "8082:3000"
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "8083:9090"
    depends_on:
      - registry
      - load-balancer
      - mock-service
