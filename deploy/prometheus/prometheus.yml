global:
  scrape_interval: 5s

scrape_configs:
  - job_name: registry
    static_configs:
      - targets:
          - registry:10000

  - job_name: load-balancer
    static_configs:
      - targets:
          - load-balancer:10010

  - job_name: mock-service
    static_configs:
      - targets:
          - mock-service:10020