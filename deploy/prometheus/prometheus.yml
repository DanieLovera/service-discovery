global:
  scrape_interval: 5s

scrape_configs:
  - job_name: registry
    static_configs:
      - targets:
          - registry-1:10000
          - registry-2:10000
          - registry-3:10000
          - registry-4:10000
          - registry-5:10000

  - job_name: load-balancer
    static_configs:
      - targets:
          - load-balancer:10010

  - job_name: mock-service
    static_configs:
      - targets:
          - mock-service-1:10020
          - mock-service-2:10020
          - mock-service-3:10020