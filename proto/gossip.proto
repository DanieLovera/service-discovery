syntax = "proto3";

package gossip;

option go_package = "tpiii.local/daniel-tpiii/gen/gossip;gossippb";

message Message {
  string sender_id = 1;

  oneof payload {
    StateUpdate state_update = 2;
  }
}

message StateUpdate {
  repeated InstanceState states = 1;
}

message InstanceState {
  string service_name = 1;
  string instance_id = 2;
  string address = 3;
  int32 weight = 4;
  int64 heartbeat_interval_ms = 5;
  InstanceStatus status = 6;
  Version version = 7;
}

message Version {
  uint64 lamport_timestamp = 1;
  string node_id = 2;
}

enum InstanceStatus {
  INSTANCE_STATUS_UNSPECIFIED = 0;
  INSTANCE_STATUS_HEALTHY = 1;
  INSTANCE_STATUS_EXPIRED = 2;
  INSTANCE_STATUS_DELETED = 3;
}
