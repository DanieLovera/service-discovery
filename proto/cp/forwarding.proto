syntax = "proto3";

package cp;

option go_package = "tpiii.local/daniel-tpiii/gen/cp;cppb";

service Forwarding {
  rpc Apply(ApplyRequest) returns (ApplyResponse);
  rpc Lookup(LookupRequest) returns (LookupResponse);
}

message ApplyRequest {
  string sender_id = 1;
  bytes command = 2;
}

message ApplyResponse {
  Status status = 1;
}

message LookupRequest {
  string sender_id = 1;
  string service_name = 2;
  optional string instance_id = 3;
}

message LookupResponse {
  Status status = 1;
  bytes instances = 2;
}

enum Status {
  STATUS_OK = 0;
  STATUS_ALREADY_EXISTS = 1;
  STATUS_NOT_FOUND = 2;
  STATUS_DELETED = 3;
  STATUS_NOT_LEADER = 4;
}
