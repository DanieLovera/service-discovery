syntax = "proto3";

package ap;

import "proto/ap/state.proto";
import "proto/ap/swim.proto";

option go_package = "tpiii.local/daniel-tpiii/gen/ap;appb";

message Packet {
  string sender_id = 1;

  oneof payload {
    StateUpdate state_update = 2;
    Ping ping = 3;
    Ack ack = 4;
    PingReq ping_req = 5;
  }
}
