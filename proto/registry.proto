syntax = "proto3";

package registry;

option go_package = "tpiii.local/daniel-tpiii/gen/registry;registrypb";

service RegistryService {
  rpc Register(RegisterRequest) returns (RegisterResponse);
  rpc Update(UpdateRequest) returns (UpdateResponse);
  rpc Deregister(DeregisterRequest) returns (DeregisterResponse);
  rpc Lookup(LookupRequest) returns (LookupResponse);
}

message RegisterRequest {
  string service_name = 1;
  string instance_id = 2;
  string address = 3;
  int32 weight = 4;
  int64 heartbeat_interval_ms = 5;
}

message RegisterResponse {}

message UpdateRequest {
  string service_name = 1;
  string instance_id = 2;
  string address = 3;
  int32 weight = 4;
  int64 heartbeat_interval_ms = 5;
}

message UpdateResponse {}

message DeregisterRequest {
  string service_name = 1;
  string instance_id = 2;
}

message DeregisterResponse {}

message LookupRequest {
  string service_name = 1;
  optional string instance_id = 2;
}

message LookupResponse {
  repeated ServiceInstance instances = 1;
}

message ServiceInstance {
  string service_name = 1;
  string instance_id = 2;
  string address = 3;
  int32 weight = 4;
  int64 heartbeat_interval_ms = 5;
  ServiceInstanceStatus status = 6;
}

enum ServiceInstanceStatus {
  SERVICE_INSTANCE_STATUS_UNSPECIFIED = 0;
  SERVICE_INSTANCE_STATUS_HEALTHY = 1;
  SERVICE_INSTANCE_STATUS_EXPIRED = 2;
  SERVICE_INSTANCE_STATUS_DELETED = 3;
}